name: Build & Release iOS App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: macos-14
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Build Kharcha App
        run: |
          xcodebuild build \
            -project Kharcha.xcodeproj \
            -scheme Kharcha \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            BUILD_DIR=build

      - name: Package App (.zip)
        run: |
          cd build/Release-iphoneos
          zip -r ../../Kharcha-iOS.zip Kharcha.app
          cd ../..

      - name: Create GitHub Release & Upload Assets
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          name: Kharcha ${{ github.ref_name || inputs.version }}
          tag_name: ${{ github.ref_name || inputs.version }}
          body: |
            ## 💸 Kharcha ${{ github.ref_name || inputs.version }}
            
            ### ✨ What's Included:
            * **Expense & Budget Tracking**: UPI/Cash/Card logging with category breakdowns and alerts.
            * **Apple Shortcuts & Siri**: Back Tap quick-add with dynamic category picker and receipt photo support.
            * **Interactive Widgets**: Live spend, budget balance, and 1-tap water logger on Home Screen.
            * **Apple HealthKit**: Step count rings, active calories, walking distance, exercise time & sleep analysis.
            * **100% Offline & Private**: On-device SwiftData with portable JSON backup.
            
            Built with ❤️ by **Ram**.
          files: |
            Kharcha-iOS.zip
          draft: false
          prerelease: false
